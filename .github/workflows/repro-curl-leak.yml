name: Repro curl verbose credential leak

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce curl verbose header logging
        run: |
          OSSRH_USERNAME="dummy_user_12345"
          OSSRH_PASSWORD="dummy_pass_67890"
          TOKEN=$(printf '%s' "$OSSRH_USERNAME:$OSSRH_PASSWORD" | base64 -w0)

          echo "TOKEN=$TOKEN"
          curl -v -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://example.com/manual/upload/repository/test-repo || true
