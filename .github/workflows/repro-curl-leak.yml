name: Repro curl verbose credential leak

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce curl verbose header logging
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          printf '%s' "$OSSRH_USERNAME:$OSSRH_PASSWORD" | base64 -w0 > token.txt
          read -r TOKEN < token.txt

          curl -v -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://example.com/manual/upload/repository/test-repo || true
